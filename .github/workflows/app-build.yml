# Compile verification for the iOS app and its hosted test bundle.
#
# It is anonymity-safe: CODE_SIGNING_ALLOWED=NO, no secrets, no signing identity, no artifacts uploaded.
#
# COMPILE-ONLY for the tests. NOOPiOSTests has a deployment target of iOS 27, and the macos-26 runner
# ships Xcode 26.6 with iOS simulators up to 26.5, so it cannot run them. Run `Tools/ios.sh test`
# locally. Add a `test` step when a GitHub runner has an iOS 27 simulator.
name: App build (iOS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      # The app-target TESTS, not just the sources they cover. The build-for-testing step below compiles
      # StrandTests, but a PR touching only those tests matched nothing here, so it built
      # nothing: one that failed to compile, or simply failed, merged unverified and went red on the
      # next unrelated PR that happened to touch `Strand/**`, mis-attributing the breakage to whoever
      # that was.
      #
      # This is the only test directory that needs naming, and the reason is layout rather than
      # oversight: Android's tests sit under `android/**` and the package suites under `Packages/**`,
      # both already inside their subject's glob, while StrandTests is a SIBLING of `Strand/` instead
      # of part of it. `project.yml` does not cover it either — the target takes
      # `sources: [StrandTests]`, a directory, so adding a test file changes no other tracked path.
      - 'StrandTests/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  # No `push: main` leg. Every change reaches main through a PR, which the trigger above already
  # gates. A RELEASE pushes straight to main with no PR, but fork-release.yml builds NOOPiOS itself, so
  # that path keeps its own compile gate. The gap this leaves is a direct non-release push to main;
  # `workflow_dispatch` below covers checking one on demand.
  # `pr:` builds a PR's MERGE RESULT without pushing anything. Checking "does this PR compile once
  # merged?" used to mean creating a throwaway `ci/` branch holding main+PR and dispatching at it —
  # which left a "Compare & pull request" banner behind for every probe, because GitHub keys that
  # banner off the PUSH EVENT and it outlives the branch the cleanup job deletes. GitHub already
  # maintains exactly the ref we were hand-building, at refs/pull/<n>/merge, so no branch is needed.
  #
  # Leave it blank to build whatever ref you dispatched against, unchanged.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to build as merged into main (blank = build this ref as-is)"
        required: false
        default: ""

concurrency:
  # Keyed on the PR when one is given, so two probes of the SAME pr supersede each other while probes
  # of different PRs (all dispatched from main) do not cancel one another.
  group: app-build-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # iOS needs the iOS 26 SDK (Liquid Glass's `glassEffect`), which macos-15's default Xcode lacks.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The PR's HEAD, then merge current main below. NOT refs/pull/<n>/merge: GitHub freezes that
          # ref at the last time the PR merged CLEANLY, so for a conflicting or simply stale PR it is a
          # merge against an old main and it still resolves. Probing #931 through it would have compiled
          # main as of 30 July, 30+ commits behind, and reported SUCCESS - a false green, and worse than
          # the branch it replaced. Merging here is always against main as it is right now.
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}
          # QUOTED '0': GitHub expressions treat the number 0 as FALSY, so `inputs.pr && 0 || 1`
          # silently yields 1 and leaves the clone shallow - the merge below then dies with
          # "refusing to merge unrelated histories" (exit 128) for EVERY pr, mergeable or not.
          fetch-depth: ${{ inputs.pr && '0' || '1' }}

      - name: Merge current main
        if: inputs.pr != ''
        run: |
          git fetch --no-tags origin main
          echo "PR #${{ inputs.pr }} head: $(git log --oneline -1 HEAD)"
          echo "merging into:  $(git log --oneline -1 FETCH_HEAD)"
          git -c user.name=ci -c user.email=ci@local merge --no-edit FETCH_HEAD

      - name: Say what is being built
        run: |
          if [ -n "${{ inputs.pr }}" ]; then
            echo "Built: PR #${{ inputs.pr }} merged into current main"
          else
            echo "Built: ${GITHUB_REF_NAME} as-is"
          fi
          git log --oneline -1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOPiOS
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      # See the header: this compiles StrandTests but cannot run them on this runner.
      - name: Compile NOOPiOSTests
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build-for-testing
