# iOS-only development spec. It builds the iPhone app and its packages, and nothing else: no macOS app,
# no Watch app and no widget extension. Generate with Tools/ios.sh; project.yml stays the release spec.
include: project.yml
name: BroopiOS
targets:
  NOOPiOS:
    dependencies:REPLACE:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: OuraProtocol
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: MarkdownUI
      - package: ZIPFoundation
      - package: PolarProtocol
    settings:
      base:
        # Lets the shared test sources keep `@testable import Strand` when hosted by the iPhone app.
        PRODUCT_MODULE_NAME: Strand
  # StrandTests, hosted by the iPhone app instead of the macOS app.
  NOOPiOSTests:
    type: bundle.unit-test
    platform: iOS
    # The coach recovery tests name iOS 27 model errors; the simulators run iOS 27.
    deploymentTarget: "27.0"
    sources:
      - path: StrandTests
        excludes:
          # These test screens that only the macOS app compiles.
          - ActiveWorkoutClockTests.swift
          - ActiveWorkoutIndicatorTests.swift
          - HostedCardPrefsTests.swift
          - LiquidEffortNoteTests.swift
          - LiquidSkyMotionTests.swift
          - LiquidTodayTileValueTests.swift
          - SettingsDisclosureDefaultsTests.swift
          - RollingStepsAverageTests.swift
          - TodayLayoutPrefsTests.swift
          - KeyMetricPrefsDecodeTests.swift
          - MoreSectionPrefsTests.swift
          - BatteryGuidedCaptureTests.swift
          - StressLoadCancellationTests.swift
