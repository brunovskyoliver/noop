      - StrandiOSShared/StressTrace.swift
      - StrandiOSShared/WidgetTelemetry.swift
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    dependencies:
      - target: NOOPiOS
      - package: WhoopProtocol
      - package: WhoopStore
      - package: OuraProtocol
      - package: StrandDesign
      - package: StrandAnalytics
      - package: StrandImport
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP.app/NOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NOOPiOS:
    build:
      targets:
        NOOPiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: NOOPiOSTests
          # These assume a macOS host: its app group fallback, no launch-time background scheduling and
          # no wind-down state left in the host's defaults.
          skippedTests:
            - RescoreBackgroundSchedulerTests/testASpacedOffloadIsOwedNotDropped()
            - RescoreBackgroundSchedulerTests/testDeferringMarksTheWorkOwedAndDoesNotRunIt()
            - WatchScoreSnapshotTests/testStorageContractMatchesWatchSideExpectation()
            - WindDownPerDayOverrideTests/testEarlyWakeNudge_pinnedToPreviousDay()
            - WindDownPerDayOverrideTests/testNudgeDayShift_earlyWake_isPreviousDay()
            - WindDownPerDayOverrideTests/testNudgeDayShift_lateWake_isSameDay()
